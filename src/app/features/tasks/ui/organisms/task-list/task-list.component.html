@if (tasks().length > 0) {
  <app-section-header [title]="'tasks.section.title' | transloco" [count]="tasks().length" />
  <ion-list>
    @for (task of tasks(); track task.id) {
      <app-task-item
        [task]="task"
        [showCategory]="showCategory()"
        [category]="task.categoryId ? (categoriesById().get(task.categoryId) ?? null) : null"
        (toggleComplete)="toggleComplete.emit(task)"
        (edit)="edit.emit(task)"
        (remove)="remove.emit(task)"
        (menuRequested)="menuRequested.emit(task)"
      />
    }
  </ion-list>
} @else {
  <app-empty-state
    icon="checkbox-outline"
    [title]="'tasks.empty.title' | transloco"
    [message]="'tasks.empty.message' | transloco"
  />
}
