<ion-item-sliding>
  <ion-item lines="none" button [detail]="false" (click)="edit.emit()">
    <app-icon-badge slot="start" icon="pricetag" [color]="category().color" />
    <div class="info">
      <h3 class="name">{{ category().name }}</h3>
      <p class="count">{{ countLabel() }}</p>
    </div>
    <app-progress-ring
      slot="end"
      [value]="ratio()"
      [size]="ringSize"
      [strokeWidth]="ringStrokeWidth"
      [color]="category().color"
      [label]="progressLabel()"
    />
    <ion-button
      slot="end"
      class="menu-button"
      fill="clear"
      [attr.aria-label]="moreLabel()"
      (click)="onMenu($event)"
    >
      <ion-icon slot="icon-only" name="ellipsis-vertical" />
    </ion-button>
  </ion-item>

  <ion-item-options side="end">
    <ion-item-option
      color="primary"
      [attr.aria-label]="'categories.actions.edit' | transloco"
      (click)="edit.emit()"
    >
      <ion-icon slot="icon-only" name="create-outline" />
    </ion-item-option>
    <ion-item-option
      color="danger"
      [attr.aria-label]="'categories.actions.delete' | transloco"
      (click)="remove.emit()"
    >
      <ion-icon slot="icon-only" name="trash-outline" />
    </ion-item-option>
  </ion-item-options>
</ion-item-sliding>
