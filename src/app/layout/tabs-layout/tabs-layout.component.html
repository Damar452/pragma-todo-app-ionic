<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="tasks">
      <ion-icon name="checkbox-outline" aria-hidden="true" />
      <ion-label>{{ 'app.tabs.tasks' | transloco }}</ion-label>
    </ion-tab-button>

    @if (categoriesEnabled()) {
      <ion-tab-button tab="categories">
        <ion-icon name="pricetags-outline" aria-hidden="true" />
        <ion-label>{{ 'app.tabs.categories' | transloco }}</ion-label>
      </ion-tab-button>
    }
  </ion-tab-bar>
</ion-tabs>
