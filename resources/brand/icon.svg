    <path fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M112,120 L116,124 L122,116" />
    <path fill="#DDD6FE" d="M140,116 H176 A4,4 0 0 1 176,124 H140 A4,4 0 0 1 140,116 Z" />

    <!-- Row 2: done -->
