<!--
  Brand master icon (source of truth for raster assets).
  Rendered by scripts/generate-icons.mjs into legacy Android launcher PNGs
  and the web favicon. The clipboard paths are shared with the Android vector
  drawables (splash + adaptive icon foreground) using a 288-unit grid.
  Gradient matches the app's hero card / FAB: #4F46E5 -> #7C3AED (135deg).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5" />
      <stop offset="1" stop-color="#7C3AED" />
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#brand)" />
  <g transform="translate(-121.6 -112.8) scale(4.4)">
