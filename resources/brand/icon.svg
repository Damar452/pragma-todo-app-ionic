    <path fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M112,150 L116,154 L122,146" />
    <path fill="#DDD6FE" d="M140,146 H170 A4,4 0 0 1 170,154 H140 A4,4 0 0 1 140,146 Z" />

    <!-- Row 3: pending -->
